name: Internal image

# Builds and publishes the internal container image and Helm chart when an
# internal-v* tag is pushed. It is not the official Release workflow: it only
# publishes artifacts and a GitHub release for the tag, using GITHUB_TOKEN.
# A manual run (on internal/main) builds without publishing.

on:
  push:
    tags: ['internal-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/profiling/git-cache-proxy
  CHART_REPO: oci://ghcr.io/profiling/charts

jobs:
  image:
    name: Build and publish
    if: github.repository == 'profiling/git-cache-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the ref
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$PUBLISH" = true ]; then
            tag=${GITHUB_REF_NAME}
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            [[ $tag =~ ^internal-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]] \
              || { echo "::error::tag $tag must look like internal-v0.2.11-1"; exit 1; }
            [ "${BASH_REMATCH[1]}" = "$version" ] \
              || { echo "::error::tag version ${BASH_REMATCH[1]} != Cargo.toml $version"; exit 1; }
            echo "CHART_VERSION=${BASH_REMATCH[1]}-internal.${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
            git fetch --no-tags origin internal/main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/internal/main \
              || { echo "::error::$GITHUB_SHA is not on internal/main"; exit 1; }
          elif [ "$GITHUB_REF" != refs/heads/internal/main ]; then
            echo "::error::manual runs must use internal/main"; exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=internal-image
          cache-to: type=gha,mode=max,scope=internal-image
      - name: Package and push the chart
        if: github.event_name == 'push'
        run: |
          helm package chart -d dist \
            --version "$CHART_VERSION" --app-version "$CHART_VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/git-cache-proxy-*.tgz "$CHART_REPO"
      - name: Write release notes
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prev=$(git tag --list 'internal-v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          export OLD_HELP=$RUNNER_TEMP/old-help.txt NEW_HELP=$RUNNER_TEMP/new-help.txt
          if [ -n "$prev" ]; then
            git worktree add --detach "$RUNNER_TEMP/prev" "$prev"
            (cd "$RUNNER_TEMP/prev" && CARGO_TARGET_DIR=$RUNNER_TEMP/prev-target \
              cargo build --locked --bin git-cache-proxy)
            "$RUNNER_TEMP/prev-target/debug/git-cache-proxy" --help > "$OLD_HELP"
            docker run --rm "$IMAGE@$DIGEST" --help > "$NEW_HELP"
          fi
          .github/scripts/release_notes.sh > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
